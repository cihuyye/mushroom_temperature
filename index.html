<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Monitoring Kumbung Jamur Tiram</title>
    <!-- Tailwind CSS CDN untuk Tampilan Modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN untuk Grafik Histori Realtime -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Header -->
        <header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900">Monitoring Kumbung Jamur Tiram</h1>
                <p class="text-sm text-slate-500 mt-1">Sistem Otomasi Suhu & Kelembapan Berbasis IoT & Firebase</p>
            </div>
            <div class="flex items-center gap-2 bg-slate-50 px-4 py-2 rounded-xl border border-slate-200">
                <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-xs font-semibold text-slate-600">Sistem Aktif (Realtime)</span>
            </div>
        </header>

        <!-- Status Kondisi Utama -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
            <div>
                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Status Lingkungan</p>
                <p id="condition-val" class="text-2xl font-black text-slate-700 mt-1">Memuat data...</p>
                <p id="condition-msg" class="text-xs text-slate-500 mt-0.5">-</p>
            </div>
            <div id="status-badge" class="px-4 py-2 rounded-xl text-sm font-bold bg-slate-100 text-slate-600">
                PENDING
            </div>
        </div>

        <!-- Metric Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- Suhu -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Suhu Realtime</p>
                <div class="flex items-baseline mt-2 gap-1">
                    <span id="temp-val" class="text-4xl font-black text-rose-500">--</span>
                    <span class="text-xl font-bold text-slate-400">°C</span>
                </div>
            </div>

            <!-- Kelembapan -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Kelembapan Udara</p>
                <div class="flex items-baseline mt-2 gap-1">
                    <span id="hum-val" class="text-4xl font-black text-sky-500">--</span>
                    <span class="text-xl font-bold text-slate-400">%</span>
                </div>
            </div>

            <!-- Status Kipas -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Status Kipas (Fan)</p>
                <p id="fan-val" class="text-2xl font-extrabold text-slate-400 mt-3">OFF</p>
            </div>

            <!-- Status Humidifier -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Status Humidifier</p>
                <p id="humidifier-val" class="text-2xl font-extrabold text-slate-400 mt-3">OFF</p>
            </div>
        </div>

        <!-- Grafik Histori -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-extrabold text-slate-800 mb-4">Grafik Riwayat Pembacaan Sensor</h2>
            <div class="relative w-full h-72">
                <canvas id="historyChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Integrasi Firebase JS SDK v10 (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Konfigurasi dari Firebase Console
        const firebaseConfig = {
            apiKey: "AIzaSyCkF_T6BXW0deHfe3YK1WF-jn7U-HvvODg",
            authDomain: "mushroom-monitoring-831ed.firebaseapp.com",
            databaseURL: "https://mushroom-monitoring-831ed-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mushroom-monitoring-831ed",
            storageBucket: "mushroom-monitoring-831ed.firebasestorage.app",
            messagingSenderId: "780912167030",
            appId: "1:780912167030:web:e946682a3d3e2911f2d757",
            measurementId: "G-7ZMC1FXVJ6"
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Setup Chart.js
        const ctx = document.getElementById('historyChart').getContext('2d');
        const historyChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Suhu (°C)',
                        borderColor: '#f43f5e',
                        backgroundColor: 'rgba(244, 63, 94, 0.1)',
                        data: [],
                        tension: 0.3,
                        fill: true
                    },
                    {
                        label: 'Kelembapan (%)',
                        borderColor: '#0284c7',
                        backgroundColor: 'rgba(2, 132, 199, 0.1)',
                        data: [],
                        tension: 0.3,
                        fill: true
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: false }
                }
            }
        });

        // 1. Listen Realtime Data Sensor (Suhu & Kelembapan)
        const sensorRef = ref(db, 'mushroom_environment/sensor');
        onValue(sensorRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('temp-val').innerText = data.temperature ?? '--';
                document.getElementById('hum-val').innerText = data.humidity ?? '--';
            }
        });

        // 2. Listen Realtime Status Kondisi Lingkungan
        const statusRef = ref(db, 'mushroom_environment/status');
        onValue(statusRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const condVal = document.getElementById('condition-val');
                const condMsg = document.getElementById('condition-msg');
                const badge = document.getElementById('status-badge');

                condVal.innerText = data.condition || 'Tidak diketahui';
                condMsg.innerText = data.message || '';

                if (data.condition === 'Ideal') {
                    badge.className = "px-4 py-2 rounded-xl text-sm font-bold bg-emerald-100 text-emerald-700";
                    badge.innerText = "OPTIMAL";
                } else {
                    badge.className = "px-4 py-2 rounded-xl text-sm font-bold bg-amber-100 text-amber-700";
                    badge.innerText = "PERHATIAN";
                }
            }
        });

        // 3. Listen Realtime Status Aktuator (Kipas & Humidifier)
        const actuatorsRef = ref(db, 'mushroom_environment/actuators');
        onValue(actuatorsRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const fanElem = document.getElementById('fan-val');
                const humElem = document.getElementById('humidifier-val');

                fanElem.innerText = data.fan ? "ON (MENYALA)" : "OFF (MATI)";
                fanElem.className = data.fan 
                    ? "text-2xl font-extrabold text-emerald-600 mt-3" 
                    : "text-2xl font-extrabold text-slate-400 mt-3";

                humElem.innerText = data.humidifier ? "ON (MENYALA)" : "OFF (MATI)";
                humElem.className = data.humidifier 
                    ? "text-2xl font-extrabold text-emerald-600 mt-3" 
                    : "text-2xl font-extrabold text-slate-400 mt-3";
            }
        });

        // 4. Listen Data Histori untuk Grafik (Ambil 15 data terakhir)
        const historyRef = query(ref(db, 'mushroom_environment/history'), limitToLast(15));
        onValue(historyRef, (snapshot) => {
            const labels = [];
            const tempDatas = [];
            const humDatas = [];

            snapshot.forEach((childSnapshot) => {
                const item = childSnapshot.val();
                const time = item.timestamp 
                    ? new Date(item.timestamp * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    : '';
                labels.push(time);
                tempDatas.push(item.temperature);
                humDatas.push(item.humidity);
            });

            historyChart.data.labels = labels;
            historyChart.data.datasets[0].data = tempDatas;
            historyChart.data.datasets[1].data = humDatas;
            historyChart.update();
        });
    </script>
</body>
</html>
